name: LIMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r lims/requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: lims.config.settings.ci
        run: python manage.py test lims.tests --verbosity=2
