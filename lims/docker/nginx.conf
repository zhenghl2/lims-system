events {}

http {
    include /etc/nginx/mime.types;
    default_type text/html;

    upstream web { server web:8000; }
    upstream crm { server crm-nginx:80; }
    upstream crm_api { server crm-web:8001; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;

        location /crm/api/ {
            proxy_pass http://crm_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /crm/admin/ {
            proxy_pass http://crm_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /assets/ {
            root /frontend/dist;
            try_files $uri @crm_assets;
        }
        location @crm_assets {
            root /usr/share/nginx/crm;
            try_files $uri =404;
        }

        location /crm/ {
            root /usr/share/nginx/crm;
            try_files $uri $uri/ /crm/index.html;
        }

        location = /index.html {
            root /frontend/dist;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location / {
            root /frontend/dist;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location /static/ { alias /staticfiles/; expires 30d; }
        location /media/ { alias /media/; expires 7d; }

        location /api/ {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
