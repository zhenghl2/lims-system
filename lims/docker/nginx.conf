events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on; tcp_nopush on; keepalive_timeout 65;
    gzip on; gzip_types text/plain application/json application/javascript text/css; gzip_min_length 1000;

    upstream web { server web:8000; }
    upstream crm { server crm-nginx:80; }
    upstream crm_api { server crm-web:8001; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;

        # ── CRM API (direct to backend, skip CRM nginx routing) ──
        location /crm/api/ {
            proxy_pass http://crm_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── CRM Admin ──
        location /crm/admin/ {
            proxy_pass http://crm_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── CRM Frontend (SPA via CRM nginx) ──
        location /crm/ {
            proxy_pass http://crm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── LIMS API ──
        location /api/ {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /static/ { alias /staticfiles/; expires 30d; }
        location /media/ { alias /media/; expires 7d; }
        location /admin/ { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /health/ { return 200 "OK"; add_header Content-Type text/plain; }
    }
}
