# 2026-11-12：不要用 upstream + 容器名。nginx 只在启动时解析一次 DNS，
# web 容器重建后 IP 变化 → 长期 502（今天登录报"密码错误"就是它）。
# 改为 resolver + 变量：每 10s 重新解析，容器换 IP 自动跟上。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    # 变量上游：配合顶部 resolver，容器换 IP 也能自动跟随
    set $lims_web web:8000;

    # ── 传输压缩（2026-10-10 开启）──
    # 实测：JS 2934KB→966KB(省67%)、列表接口 JSON 1549KB→149KB(省90%)
    # gzip_proxied any 必须保留：接口走 proxy_pass，默认 off 会导致代理响应不被压缩
    gzip on;
    gzip_comp_level 5;          # 4~6 是性价比拐点，9 更慢收益极小
    gzip_min_length 1024;       # 小于 1KB 不压（省 CPU，收益也小）
    gzip_vary on;               # 保证中间缓存/CDN 区分压缩与未压缩版本
    gzip_proxied any;           # 关键：让 proxied 的 API 响应也压缩
    gzip_types text/plain text/css text/xml
               application/javascript application/json application/xml
               application/x-javascript image/svg+xml;

    # Assets (JS/CSS)
    location /assets/ {
        root /frontend/dist;
        try_files $uri =404;
    }

    # Legacy CRM paths — removed 2026-09-07 (old crm containers gone;
    # CRM2 is served standalone on :8081). Explicit reject beats SPA fallback.
    location ^~ /crm {
        return 404;
    }

    # LIMS Frontend
    # Prevent caching of index.html (JS chunks change on deploy)
    location / {
        root /frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /static/ { alias /staticfiles/; expires 30d; }
    # 2026-11-04：报告文件是「同名覆盖」重新生成的（WJ..-Y(2026.11.04).docx），
    # 7 天强缓存会让用户下载到旧版本 → 报告目录改为每次协商（ETag 304 很便宜）
    location /media/nippt_reports/ {
        alias /media/nippt_reports/;
        expires -1;          # 等价于 Cache-Control: no-cache（协商 ETag）
    }
    location /media/ { alias /media/; expires 7d; }

    location /api/ {
        proxy_pass http://$lims_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://$lims_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ { return 200 'OK'; add_header Content-Type text/plain; }
}
