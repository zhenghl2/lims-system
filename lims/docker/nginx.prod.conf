upstream web { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Assets (JS/CSS)
    location /assets/ {
        root /frontend/dist;
        try_files $uri =404;
    }

    # Legacy CRM paths — removed 2026-09-07 (old crm containers gone;
    # CRM2 is served standalone on :8081). Explicit reject beats SPA fallback.
    location ^~ /crm {
        return 404;
    }

    # LIMS Frontend
    # Prevent caching of index.html (JS chunks change on deploy)
    location / {
        root /frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /static/ { alias /staticfiles/; expires 30d; }
    location /media/ { alias /media/; expires 7d; }

    location /api/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ { return 200 'OK'; add_header Content-Type text/plain; }
}
