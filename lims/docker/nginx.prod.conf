upstream web { server web:8000; }
upstream crm { server crm-nginx:80; }
upstream crm_api { server crm-web:8001; }

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # CRM API
    location /crm/api/ {
        proxy_pass http://crm_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # CRM Admin
    location /crm/admin/ {
        proxy_pass http://crm_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets (JS/CSS) — LIMS first, CRM fallback
    location /assets/ {
        root /frontend/dist;
        try_files $uri @crm_assets;
    }

    location @crm_assets {
        proxy_pass http://crm;
        proxy_set_header Host $host;
    }

    # CRM Frontend SPA
    location /crm/ {
        proxy_pass http://crm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # LIMS Frontend
    location / {
        root /frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location /static/ { alias /staticfiles/; expires 30d; }
    location /media/ { alias /media/; expires 7d; }

    location /api/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ { return 200 'OK'; add_header Content-Type text/plain; }
}
